# Generated by utils.py
# Language: Burmese (my)

# Paraphrase identification task for Burmese (Myanmar)
# Uses HuggingFace's json dataset loader for local JSONL files

task: aisg_nlu_paraphrase_my

# Use HuggingFace's built-in json dataset loader
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: lm_eval/tasks/aisg_nlu_paraphrase/data/my_myparaphrase.jsonl

test_split: test

# Task configuration
output_type: multiple_choice

# Prompt: concatenate both sentences
doc_to_text: "{{prompts[0].sentence1}} {{prompts[0].sentence2}}"

# Answer choices in Burmese
# Index 0: "paraphrase" (အဓိပ္ပာယ်တူ)
# Index 1: "not paraphrase" (အဓိပ္ပာယ်တူမဟုတ်)
doc_to_choice: ["အဓိပ္ပာယ်တူ", "အဓိပ္ပာယ်တူမဟုတ်"]

# Map text_label field to choice index
doc_to_target: !function utils.doc_to_target

# Metrics
metric_list:
  - metric: acc
    aggregation: mean
    weight_by_size: true

metadata:
  version: 2.0

