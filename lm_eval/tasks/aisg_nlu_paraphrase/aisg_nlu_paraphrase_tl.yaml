# Generated by utils.py
# Language: Filipino (Tagalog) (tl)

# Paraphrase identification task for Filipino/Tagalog
# Uses HuggingFace's json dataset loader for local JSONL files

task: aisg_nlu_paraphrase_tl

# Use HuggingFace's built-in json dataset loader
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: lm_eval/tasks/aisg_nlu_paraphrase/data/tl_paws.jsonl

test_split: test

# Task configuration
output_type: multiple_choice

# Prompt: concatenate both sentences
doc_to_text: "{{prompts[0].sentence1}} {{prompts[0].sentence2}}"

# Answer choices in Filipino
# Index 0: "paraphrase"
# Index 1: "not paraphrase"
doc_to_choice: ["Paraphrase", "Hindi paraphrase"]

# Map text_label field to choice index
doc_to_target: !function utils.doc_to_target

# Metrics
metric_list:
  - metric: acc
    aggregation: mean
    weight_by_size: true

metadata:
  version: 2.0

